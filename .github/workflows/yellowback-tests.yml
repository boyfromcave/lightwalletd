# CI for lightwalletd-dd (docs/plans/yellowback-lightwalletd-plan.md, Phase R0). The baseline
# (zcash/lightwalletd 0.4.6 via yodl) ships GitLab CI and Tekton, not GitHub Actions; this is the
# fork's own, kept small: the Makefile's build and tests, vet, gofmt on the files this fork added,
# and the generated-code check (scripts/check-generated.sh, protoc-gen-go v1.26.0 +
# protoc-gen-go-grpc v1.1.0).
#
# Tiers (workspace CI/CD design, 2026-10-06):
#   push / pull_request   build-and-test, generated-code, docker-image: three parallel jobs, each a
#                         few minutes warm (Go build cache restored by setup-go).
#   workflow_dispatch     the same, plus `node` + `devnet` when the `devnet` input is set: ycashd is
#                         built from a node line at the branch that matches this one and
#                         scripts/devnet-test.sh runs this fork's server and the lightwalletd-legacy
#                         baseline against a fresh devnet (the GetBlockRange byte-equality gate, the
#                         YED views). The scheduled run of that suite lives in the node lines'
#                         nightlies (they clone this repository at a pinned commit); component repos
#                         carry no schedule.
#
# Supply chain (audit E-6): actions are pinned by commit SHA (the tag is the comment), the Go
# toolchain is an exact version (go.mod's `go 1.12` names a language floor, not a toolchain;
# 1.24.7 is what the node's nightly installs for this fork), the runner image is a release,
# and protoc is a release zip verified against its SHA-256 (the version docs/yellowback.md
# records) rather than whatever protobuf-compiler Ubuntu ships that day.
name: yellowback-tests

# The branch list lives once, here: pull_request is unfiltered (every PR runs), push runs on the
# hardening and upgrade lines, the branch of record (AGENTS.md) and the ci/* branches that carry
# CI changes before they merge. lightwalletd-legacy (the pristine baseline) is never pushed to.
on:
  push:
    branches: [ harden/yellowback, upgrade/vault, upgrade/vault-in-term, main, feature/yellowback-price-attest, 'ci/**' ]
  pull_request:
  workflow_dispatch:
    inputs:
      devnet:
        description: Also build ycashd and run scripts/devnet-test.sh against a fresh devnet
        type: boolean
        default: false
      node_line:
        description: Which node line the devnet runs (both must stay green, AGENTS.md)
        type: choice
        options: [ ycash-dd, ycash6 ]
        default: ycash-dd
      node_ref:
        description: Node branch, tag or commit (empty = the branch matching this one)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push or PR update supersedes the older run; a dispatched run is never cancelled.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  GO_VERSION: '1.24.7'
  NODE_REPO_YCASH_DD: boyfromcave/ycash-dd
  NODE_REPO_YCASH6: boyfromcave/ycash6

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        # The tree is vendored, so what the cache carries that matters is the build cache
        # (~/.cache/go-build, content-addressed: a stale entry can only miss). Keyed on go.sum.
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Build (vendored, as the Makefile)
        run: CGO_ENABLED=0 go build -mod=vendor -o lightwalletd . && go build -mod=vendor -o /dev/null ./testtools/lwdinfo
      - name: Vet
        run: go vet -mod=vendor ./cmd/... ./common/... ./frontend/... ./walletrpc/...
      - name: Vet the devnet suite (-tags devnet; it runs only from a devnet, so compile it on every push)
        run: go vet -mod=vendor -tags devnet ./frontend/
      - name: gofmt (files this fork added)
        run: test -z "$(gofmt -l common/yellowback.go frontend/yellowback*.go testtools/lwdinfo)"
      - name: Test (every package but frontend)
        run: go test -mod=vendor ./cmd/... ./common/... ./parser/... ./walletrpc/...
      - name: The contract fixture equals the node's (ycash-dd at the matching branch)
        # testdata/yellowback/contract.json is the node's generated contract (the workspace's
        # `make spec`); the allow-list tests read it, so a fixture that drifted from the node's is a
        # server tested against a contract the node does not serve. Skipped (with a notice) while
        # the matching node branch is not on GitHub yet.
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            ci/harden*|harden/yellowback) node=harden/yellowback ;;
            upgrade/vault-in-term) node=upgrade/vault-in-term ;;
            ci/upgrade*|upgrade/vault)    node=upgrade/vault ;;
            *)                            node=feature/yellowback-price-attest ;;
          esac
          url="https://raw.githubusercontent.com/$NODE_REPO_YCASH_DD/$node/doc/yellowback-rpc-contract.json"
          if ! curl -fsSL -o "$RUNNER_TEMP/node-contract.json" "$url"; then
            echo "::notice::$NODE_REPO_YCASH_DD has no $node (or no contract there) yet; fixture comparison skipped"
            exit 0
          fi
          cmp testdata/yellowback/contract.json "$RUNNER_TEMP/node-contract.json" \
            && echo "testdata/yellowback/contract.json = $NODE_REPO_YCASH_DD@$node doc/yellowback-rpc-contract.json"
      - name: "Test (frontend: the Yellowback suite by name)"
        # The baseline's own frontend tests fail and then hang at 187a267 (F-R1: yodl's Ycash
        # regex commit invalidated upstream's t-address test data, after which the RPC stubs run
        # out of order and TestGetBlockRange waits forever). They are not this fork's to fix; the
        # Yellowback tests run by name so the package is still covered.
        run: go test -mod=vendor -count=1 -timeout 120s -run 'Unary|Streaming|Params|NodeErrors|InputValidation|AllowList|Probe|YedTo|TaddrOf|RateLimit|CallYed|ListVaults|TipAnswers|ConfDefaultPorts|NewZRPCFromConf|ChainInfo|Vault' ./frontend/

  generated-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false   # setup-go's cache is keyed on go.sum; the generators are not in it (below)
      - name: Cache the generators' modules and build (keyed on their pinned versions)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: protoc-gen-${{ runner.os }}-go${{ env.GO_VERSION }}-go-v1.26.0-grpc-v1.1.0
      - name: Install protoc (release zip, SHA-256 verified)
        env:
          PROTOC_VERSION: "36.1"
          PROTOC_SHA256: c4bc672d9d49214dc8cafdceadf4df92182d6ca8e3ec65a56b2d7de5602669b4
        run: |
          set -euo pipefail
          curl -sSL -o "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/protoc/bin/protoc" --version
      - name: Install the pinned generators (protoc-gen-go v1.26.0, protoc-gen-go-grpc v1.1.0)
        run: |
          set -x
          mkdir -p "$RUNNER_TEMP/gen-bin"
          GOBIN="$RUNNER_TEMP/gen-bin" GOFLAGS= go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.26.0
          GOBIN="$RUNNER_TEMP/gen-bin" GOFLAGS= go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.1.0
          ls -l "$RUNNER_TEMP/gen-bin"
          echo "$RUNNER_TEMP/gen-bin" >> "$GITHUB_PATH"
      - name: Run protoc on every walletrpc proto
        run: |
          set -x
          which protoc protoc-gen-go protoc-gen-go-grpc
          mkdir -p "$RUNNER_TEMP/gen"
          cd walletrpc
          protoc --go_out="$RUNNER_TEMP/gen" --go_opt=paths=source_relative --go-grpc_out="$RUNNER_TEMP/gen" --go-grpc_opt=paths=source_relative *.proto
          ls -l "$RUNNER_TEMP/gen"
      - name: Regenerate and diff (scripts/check-generated.sh)
        run: scripts/check-generated.sh

  docker-image:
    # The Dockerfile must keep building this tree (README "Docker"): build it, no registry push,
    # and prove the entrypoint turns the environment into flags by asking the image for --help.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: docker build
        run: docker build --build-arg LWD_VERSION=ci -t ycash/lightwalletd:ci .
      - name: image runs as uid 2002 and prints the flag list
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id ycash/lightwalletd:ci -u)" = "2002"
          docker run --rm -e YCASHD_RPC_HOST=127.0.0.1 -e YCASHD_RPC_USER=u -e YCASHD_RPC_PASSWORD=p -e LWD_INSECURE=1 \
            ycash/lightwalletd:ci --help | grep -q -- '--yellowback'

  node:
    # ycashd for the devnet, from the node line the dispatch names. The binaries are cached per node
    # commit, so a second dispatch at the same node commit skips the build; depends and the zk
    # parameters are cached the way the node's own CI caches them.
    if: github.event_name == 'workflow_dispatch' && inputs.devnet
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    outputs:
      repo: ${{ steps.ref.outputs.repo }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Resolve the node branch
        id: ref
        env:
          LINE: ${{ inputs.node_line }}
          NODE_REF: ${{ inputs.node_ref }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$LINE" = ycash6 ]; then repo=$NODE_REPO_YCASH6; record=feature/yellowback; else repo=$NODE_REPO_YCASH_DD; record=feature/yellowback-price-attest; fi
          ref=$NODE_REF
          if [ -z "$ref" ]; then
            case "$BRANCH" in
              ci/harden*|harden/yellowback) ref=harden/yellowback ;;
              upgrade/vault-in-term) ref=upgrade/vault-in-term ;;
              ci/upgrade*|upgrade/vault)    ref=upgrade/vault ;;
              *)                            ref=$record ;;
            esac
          fi
          if printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            sha=$ref
          else
            sha=$(git ls-remote "https://github.com/$repo.git" "refs/heads/$ref" "refs/tags/$ref^{}" "refs/tags/$ref" | awk 'NR==1{print $1}')
          fi
          [ -n "$sha" ] || { echo "::error::$repo has no ref $ref"; exit 1; }
          echo "node: $repo $ref = $sha"
          { echo "repo=$repo"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.ref.outputs.repo }}
          ref: ${{ steps.ref.outputs.sha }}
          path: node
          persist-credentials: false
      - name: Cache the node binaries (per node commit)
        id: cache-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node-bin.tar
          key: node-bin-${{ runner.os }}-${{ steps.ref.outputs.repo }}-${{ steps.ref.outputs.sha }}
      - name: Install build prerequisites
        if: steps.cache-bin.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libc6-dev m4 g++-multilib \
            autoconf libtool ncurses-dev unzip git python3 zlib1g-dev curl bsdmainutils automake libtinfo5
      - name: Cache depends
        if: steps.cache-bin.outputs.cache-hit != 'true'
        id: cache-depends
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node/depends/x86_64-pc-linux-gnu
            node/depends/built
            node/depends/sources
          key: depends-${{ runner.os }}-${{ steps.ref.outputs.repo }}-${{ hashFiles('node/depends/packages/**', 'node/depends/Makefile', 'node/depends/hosts/**', 'node/depends/builders/**') }}
      - name: Build depends
        if: steps.cache-bin.outputs.cache-hit != 'true' && steps.cache-depends.outputs.cache-hit != 'true'
        working-directory: node
        run: BUILD_STAGE=depends ./zcutil/build.sh -j"$(nproc)"
      - name: Build ycashd and ycash-cli
        if: steps.cache-bin.outputs.cache-hit != 'true'
        working-directory: node
        run: |
          ./zcutil/build.sh -j"$(nproc)"
          tar -cf ../node-bin.tar src/ycashd src/ycash-cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-bin
          path: node-bin.tar
          retention-days: 3

  devnet:
    # scripts/devnet-test.sh --up --down, the way the node's nightly runs it: a fresh
    # `yellowback-devnet up --no-attest`, this fork's server (--yellowback) and the
    # lightwalletd-legacy baseline (built from that branch by scripts/build-baseline.sh) both on
    # node 0, then `go test -tags devnet`.
    needs: [ node ]
    if: github.event_name == 'workflow_dispatch' && inputs.devnet
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: lightwalletd-dd
          fetch-depth: 0   # build-baseline.sh archives the lightwalletd-legacy branch
          persist-credentials: false
      - name: Track the baseline branch
        run: git -C lightwalletd-dd branch --quiet --track lightwalletd-legacy origin/lightwalletd-legacy
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ needs.node.outputs.repo }}
          ref: ${{ needs.node.outputs.sha }}
          path: node
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: lightwalletd-dd/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        # 3.11 as the node's CI: the devnet's quote agents read TOML with the stdlib tomllib, and the
        # inherited framework still imports asyncore, which 3.12 removed.
        with:
          python-version: '3.11'
      - name: Install the devnet's Python prerequisites (as the node's CI)
        run: |
          python3 -m pip install --user simplejson pyzmq
          site=$(python3 -c 'import site; print(site.getusersitepackages())')
          mkdir -p "$site"
          printf '%s\n' '"""Shim: pyblake2 is unmaintained; Python 3.6+ has hashlib.blake2b with the same API."""' \
                        'from hashlib import blake2b, blake2s  # noqa: F401' > "$site/pyblake2.py"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-bin
      - name: Unpack the node binaries
        run: tar -C node -xf node-bin.tar
      - name: Cache zk parameters
        id: cache-params
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.zcash-params
          key: zcash-params-${{ hashFiles('node/zcutil/fetch-params.sh') }}
      - name: Fetch zk parameters
        if: steps.cache-params.outputs.cache-hit != 'true'
        working-directory: node
        run: ./zcutil/fetch-params.sh
      - name: scripts/devnet-test.sh (the byte-equality gate against lightwalletd-legacy)
        run: |
          # Without --down: the devnet stays until the logs are uploaded (the step after next).
          YCASH_DD="$PWD/node" YELLOWBACK_LWD_REPO="$PWD/lightwalletd-dd" LWD_PYTHON="$(command -v python3)" \
          LWD_DEVNET_DIR="$RUNNER_TEMP/yb-devnet-lwd" LWD_FORK_BIN="$RUNNER_TEMP/lwd-bin/lightwalletd" \
            lightwalletd-dd/scripts/devnet-test.sh --up --dir "$RUNNER_TEMP/yb-devnet-lwd" --portseed 8
      - name: Upload the devnet logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devnet-logs
          path: ${{ runner.temp }}/yb-devnet-lwd/**/*.log
          if-no-files-found: ignore
      - name: Devnet down
        if: ${{ always() }}
        run: python3 node/contrib/yellowback/devnet/yellowback-devnet down --dir "$RUNNER_TEMP/yb-devnet-lwd" || true
