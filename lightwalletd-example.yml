# lightwalletd --config lightwalletd.yml: every flag of `lightwalletd --help` by its long name.
grpc-bind-addr: 127.0.0.1:9067
http-bind-addr: 127.0.0.1:9068
log-file: /dev/stdout
log-level: 4
tls-cert: /etc/lightwalletd/tls/cert.pem
tls-key: /etc/lightwalletd/tls/cert.key
zcash-conf-path: /etc/lightwalletd/ycash.conf   # the flag name is inherited; the file is ycashd's
data-dir: /var/lib/lightwalletd
yellowback: true
