#
# One service: lightwalletd, built from this tree, against a ycashd the operator runs
# elsewhere (there is no public Ycash node image, and a node belongs on its own host or in its
# own compose project). Copy .env.example to .env, set YCASHD_RPC_* (or mount a ycash.conf),
# then `docker compose up -d`. docs/docker.md walks through it.

services:
  lightwalletd:
    build:
      context: .
      args:
        LWD_VERSION: ${LWD_VERSION:-docker}
    image: ${LWD_IMAGE:-ycash/lightwalletd:local}
    env_file:
      - path: .env
        required: false   # copy .env.example; without it the container prints why it needs YCASHD_RPC_*
    # On Linux, host.docker.internal is not defined unless asked for; Docker Desktop defines it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LWD_BIND_HOST:-127.0.0.1}:${LWD_GRPC_PORT:-9067}:9067"
      - "${LWD_BIND_HOST:-127.0.0.1}:${LWD_HTTP_PORT:-9068}:9068"
    volumes:
      - lightwalletd_data:/var/lib/lightwalletd
      # Uncomment what you use (paths from .env; both are read-only inside the container):
      # - ${LWD_CONF_FILE:-./docker/ycash.conf}:/etc/lightwalletd/ycash.conf:ro
      # - ${LWD_TLS_DIR:-./docker/tls}:/etc/lightwalletd/tls:ro
    restart: unless-stopped

volumes:
  lightwalletd_data:
